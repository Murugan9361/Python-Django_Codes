<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar Setup</title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }

        ul{
            display: flex;
        }
        ul li{
            list-style-type: none;
            margin-right: 10px;
        }
        nav{
            display: flex;
            justify-content: space-between;
            background-color: orange;
            align-items: center;
            padding: 20px;

        }
    </style>
</head>
<body>
    <nav>
        <h1>Ruthis Banner</h1>
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Contact</li>
            <li>Services</li>
        </ul>
    </nav>
</body>
</html>
